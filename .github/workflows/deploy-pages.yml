name: Deploy to GitHub Pages

# HanPage Pages는 gh-pages 브랜치와 hanpage.paldyn.com을 사용한다.
# 수동 실행은 Build와 artifact 검증만 수행하고, main push만 배포한다.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'mydocs/**'
      - 'docs/**'
      - 'samples/**'
      - 'pdf/**'
      - 'pdf-large/**'
      - 'pdf-2020/**'
      - 'pdf-2010/**'
      - 'tests/**'
      - 'examples/**'
      - 'npm/**'
      - 'rhwp-firefox/**'
      - 'rhwp-chrome/**'
      - 'rhwp-vscode/**'
      - 'rhwp-shared/**'
      - 'HanPage-Desktop/**'
      - '*.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/CODE_OF_CONDUCT.md'
      - '.github/SECURITY.md'
      - '.github/pull_request_template.md'
      - '.github/dependabot.yml'
      - 'rhwp-logo.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- WASM 빌드 ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 브랜치 (2026-08-01 시점)
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: Build WASM
        run: wasm-pack build --target web --release

      # --- rhwp-studio 빌드 ---
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: rhwp-studio
        run: npm install

      - name: Copy WASM to public
        run: |
          cp pkg/rhwp_bg.wasm rhwp-studio/public/
          cp pkg/rhwp.js rhwp-studio/public/

      - name: Copy favicon
        run: cp assets/logo/favicon.ico rhwp-studio/public/favicon.ico

      - name: Build rhwp-studio
        working-directory: rhwp-studio
        run: npx vite build --base=/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: rhwp-studio/dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh-pages 브랜치에만 빌드 산출물 게시

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages-artifact

      - name: Extract Pages artifact
        run: |
          mkdir -p rhwp-studio/dist
          tar -xf pages-artifact/artifact.tar -C rhwp-studio/dist

      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: rhwp-studio/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
